services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: director_finding
    # ports:
    #   - "9002:5432"    # uncomment to expose DB for debugging
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d director_finding"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/director_finding
      AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9001:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID}
        VITE_ADMIN_EMAIL: ${VITE_ADMIN_EMAIL}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9000:80"

volumes:
  pgdata:

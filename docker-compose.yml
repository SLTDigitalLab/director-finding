# PostgreSQL only — run backend and frontend on the host (e.g. uvicorn, npm run dev).
# DATABASE_URL example: postgresql://postgres:password@localhost:5432/company_registry

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: company_registry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
